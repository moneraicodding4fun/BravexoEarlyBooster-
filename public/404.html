<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bravexo EarlyBooster</title>
    <script>
      // SPA deep-link redirect for GitHub Pages (project site: 1 path segment
      // to keep). Encodes the requested path into a query string so the real
      // index.html can restore it with history.replaceState.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
